name: dev
base: ubuntu@26.04

sdks:
  - name: codex
  - name: go
    channel: "1.27"

actions:
  build: |
    set -eu
    cd /project
    mkdir -p bin
    CGO_ENABLED=0 go build -buildvcs=false -ldflags "-X main.version=${WORKSHOP_DESKTOP_VERSION:-dev}" -o bin/workshop-desktop ./cmd/workshop-desktop
    install -D -m 0755 bin/workshop-desktop .workshop/host-integration/bin/workshop-desktop

  test: |
    cd /project
    exec go test "$@" ./...

  fmt: |
    cd /project
    exec go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 fmt

  lint: |
    cd /project
    exec go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run "$@"
