name: apps
base: ubuntu@26.04

sdks:
  - name: codex
  - name: project-host-integration
  - name: project-firefox
  - name: project-any
  - name: project-codex-desktop

actions:
  firefox: |
    exec /usr/local/bin/workshop-firefox "$@"

  any: |
    exec /usr/local/bin/workshop-appimage "$@"

  codex: |
    exec /usr/bin/chatgpt --ozone-platform=wayland "$@"
